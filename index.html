<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#C8553D">
<title>名古屋 5天4夜</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
/* ══════════════════════════ 基本 ══════════════════════════ */
:root{
  --brand:#C8553D; --brand-d:#A33F2B; --brand-l:#F3E0DB;
  --ink:#22201F; --ink2:#5C5754; --ink3:#8C8480;
  --bg:#FBF7F2; --card:#fff; --line:#EBE3DA;
  --ok:#2E7D5B; --warn:#B8860B; --sh:0 1px 2px rgba(34,32,31,.05),0 8px 24px rgba(34,32,31,.06);
  --r:16px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  font-family:"Noto Sans TC",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  background:var(--bg); color:var(--ink); line-height:1.6;
  padding-bottom:env(safe-area-inset-bottom);
}
img{max-width:100%;display:block}
a{color:var(--brand-d)}
button{font-family:inherit}
.wrap{max-width:820px;margin:0 auto;padding:0 16px}
.hide{display:none!important}

/* ══════════════════════════ Hero ══════════════════════════ */
.hero{
  background:linear-gradient(160deg,var(--brand) 0%,var(--brand-d) 100%);
  color:#fff;padding:calc(22px + env(safe-area-inset-top)) 0 18px;position:relative;overflow:hidden;
}
.hero::after{content:"";position:absolute;right:-60px;top:-60px;width:220px;height:220px;
  background:rgba(255,255,255,.08);border-radius:50%}
.hero h1{margin:0;font-size:27px;font-weight:900;letter-spacing:.5px;position:relative}
.hero .sub{margin:4px 0 0;opacity:.9;font-size:13.5px;position:relative}
.hero .meta{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px;position:relative}
.chip{background:rgba(255,255,255,.18);border:1px solid rgba(255,255,255,.25);
  padding:4px 11px;border-radius:99px;font-size:12.5px;font-weight:500;backdrop-filter:blur(4px)}

/* ══════════════════════════ Tabs ══════════════════════════ */
.tabbar{position:sticky;top:0;z-index:40;background:var(--bg);
  background:color-mix(in srgb,var(--bg) 92%,transparent);
  backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.tabbar .inner{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;padding:8px 16px}
.tabbar .inner::-webkit-scrollbar{display:none}
.tab{flex:0 0 auto;border:0;background:transparent;color:var(--ink3);font-size:14px;font-weight:700;
  padding:8px 14px;border-radius:99px;cursor:pointer;white-space:nowrap;transition:.15s}
.tab.on{background:var(--brand);color:#fff;box-shadow:0 3px 10px rgba(200,85,61,.3)}

/* ══════════════════════════ 通用元件 ══════════════════════════ */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh)}
.sec{margin:18px 0}
.sec-t{display:flex;align-items:baseline;justify-content:space-between;margin:0 0 10px;
  font-size:15px;font-weight:900;letter-spacing:.3px}
.sec-t small{font-weight:500;color:var(--ink3);font-size:12px}
.muted{color:var(--ink3);font-size:13px}
.loading{padding:40px 0;text-align:center;color:var(--ink3);font-size:14px}
.spin{width:22px;height:22px;border:2.5px solid var(--line);border-top-color:var(--brand);
  border-radius:50%;animation:sp .7s linear infinite;margin:0 auto 10px}
@keyframes sp{to{transform:rotate(360deg)}}
.err{background:#FFF1EE;border:1px solid #F3C9C0;color:#9B3320;padding:14px 16px;
  border-radius:12px;font-size:13.5px;margin:14px 0;line-height:1.7}
.err b{display:block;margin-bottom:4px}
.btn{border:0;background:var(--brand);color:#fff;font-weight:700;font-size:14px;
  padding:11px 18px;border-radius:11px;cursor:pointer;transition:.15s}
.btn:active{transform:scale(.97)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn.ghost{background:#fff;color:var(--brand-d);border:1.5px solid var(--brand-l)}
.btn.sm{padding:7px 13px;font-size:13px;border-radius:9px}
.pill{display:inline-block;padding:2px 9px;border-radius:99px;font-size:11.5px;font-weight:700}

/* 日期選擇 */
.days{display:flex;gap:7px;overflow-x:auto;scrollbar-width:none;padding:2px 0 4px}
.days::-webkit-scrollbar{display:none}
.day{flex:0 0 auto;background:#fff;border:1.5px solid var(--line);border-radius:13px;
  padding:9px 14px;cursor:pointer;text-align:center;min-width:74px;transition:.15s}
.day b{display:block;font-size:14px;font-weight:900}
.day span{display:block;font-size:11px;color:var(--ink3);margin-top:1px}
.day.on{background:var(--brand);border-color:var(--brand);color:#fff}
.day.on span{color:rgba(255,255,255,.85)}

/* ══════════════════════════ 行程時間軸 ══════════════════════════ */
.tl{position:relative;padding-left:6px}
.tl-item{display:grid;grid-template-columns:56px 1fr;gap:12px;position:relative}
.tl-time{text-align:right;padding-top:14px}
.tl-time b{display:block;font-size:13.5px;font-weight:900;font-variant-numeric:tabular-nums}
.tl-time span{font-size:11px;color:var(--ink3);font-variant-numeric:tabular-nums}
.tl-body{position:relative;padding:0 0 12px 20px;border-left:2px solid var(--line)}
.tl-item:last-child .tl-body{border-left-color:transparent}
.tl-dot{position:absolute;left:-7px;top:16px;width:12px;height:12px;border-radius:50%;
  background:#fff;border:3px solid var(--brand)}
.tl-card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:12px 14px;box-shadow:var(--sh)}
.tl-card h4{margin:0;font-size:15px;font-weight:800;line-height:1.45}
.tl-card .desc{margin:6px 0 0;font-size:13px;color:var(--ink2);white-space:pre-wrap}
.tl-tags{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:6px}
.tl-foot{display:flex;gap:10px;flex-wrap:wrap;margin-top:9px;padding-top:9px;
  border-top:1px dashed var(--line);font-size:12px;color:var(--ink3)}
.tl-foot a{text-decoration:none;font-weight:700}
.t-交通{background:#E8EEF6;color:#2C4E7A}
.t-景點{background:#E6F1EA;color:#22694A}
.t-美食{background:#FBEAD9;color:#8A5116}
.t-購物{background:#F3E7F5;color:#6B3179}
.t-住宿{background:#FDECEC;color:#93312B}
.t-其他{background:#EFEDEA;color:#5C5754}

/* ══════════════════════════ 花費 ══════════════════════════ */
.stat-row{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}
.stat{background:#fff;border:1px solid var(--line);border-radius:13px;padding:12px 10px;text-align:center}
.stat b{display:block;font-size:18px;font-weight:900;font-variant-numeric:tabular-nums;letter-spacing:-.3px}
.stat span{font-size:11.5px;color:var(--ink3)}
.bal{display:flex;justify-content:space-between;align-items:center;padding:11px 14px;
  border-bottom:1px solid var(--line);font-size:14px}
.bal:last-child{border-bottom:0}
.bal .who{font-weight:700}
.bal .amt{font-weight:900;font-variant-numeric:tabular-nums}
.pos{color:var(--ok)} .neg{color:var(--brand-d)}
.settle{background:var(--brand-l);border:1px solid color-mix(in srgb,var(--brand) 22%,transparent);border-radius:13px;padding:12px 14px;
  font-size:13.5px;line-height:1.9}
.settle .row{display:flex;align-items:center;gap:7px}
.settle b{font-weight:900}
.exp-item{display:grid;grid-template-columns:1fr auto;gap:10px;padding:12px 14px;
  border-bottom:1px solid var(--line)}
.exp-item:last-child{border-bottom:0}
.exp-item h5{margin:0;font-size:14.5px;font-weight:700}
.exp-item .sub{font-size:11.5px;color:var(--ink3);margin-top:3px}
.exp-item .money{text-align:right;font-weight:900;font-variant-numeric:tabular-nums;white-space:nowrap}
.exp-item .money small{display:block;font-weight:500;color:var(--ink3);font-size:11px}
.exp-item.done{opacity:.5}
form.f{display:grid;gap:10px;padding:14px}
.f label{font-size:12px;font-weight:700;color:var(--ink2);display:block;margin-bottom:4px}
.f input,.f select,.f textarea{width:100%;border:1.5px solid var(--line);border-radius:10px;
  padding:10px 12px;font-size:15px;font-family:inherit;background:#fff;color:var(--ink)}
.f input:focus,.f select:focus{outline:0;border-color:var(--brand)}
.f .two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.picks{display:flex;gap:7px;flex-wrap:wrap}
.pick{border:1.5px solid var(--line);background:#fff;color:var(--ink3);border-radius:99px;
  padding:7px 15px;font-size:13.5px;font-weight:700;cursor:pointer;transition:.15s}
.pick.on{background:var(--brand);border-color:var(--brand);color:#fff}

/* ══════════════════════════ 住宿 ══════════════════════════ */
.hotel{padding:15px 16px;margin-bottom:12px}
.hotel h4{margin:0 0 2px;font-size:16.5px;font-weight:900}
.hotel .dates{font-size:12.5px;color:var(--brand-d);font-weight:700}
.kv{display:grid;grid-template-columns:74px 1fr;gap:4px 10px;margin-top:11px;
  padding-top:11px;border-top:1px dashed var(--line);font-size:13px}
.kv dt{color:var(--ink3);font-weight:700}
.kv dd{margin:0;white-space:pre-wrap;color:var(--ink2)}

/* ══════════════════════════ 購物 ══════════════════════════ */
.filters{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px}
.filters select,.filters input{border:1.5px solid var(--line);border-radius:10px;padding:9px 11px;
  font-size:14px;font-family:inherit;background:#fff;width:100%}
.filters .full{grid-column:1/-1}
.shop{display:grid;grid-template-columns:auto 1fr auto;gap:11px;padding:12px 14px;
  border-bottom:1px solid var(--line);align-items:start}
.shop:last-child{border-bottom:0}
.shop.done .name{text-decoration:line-through;color:var(--ink3)}
.cb{width:23px;height:23px;border:2px solid var(--line);border-radius:7px;background:#fff;
  cursor:pointer;flex:0 0 auto;margin-top:2px;position:relative;transition:.15s}
.cb.on{background:var(--ok);border-color:var(--ok)}
.cb.on::after{content:"";position:absolute;left:7px;top:2.5px;width:5px;height:11px;
  border:solid #fff;border-width:0 2.5px 2.5px 0;transform:rotate(42deg)}
.shop .name{font-size:14.5px;font-weight:700;line-height:1.45}
.shop .who{font-size:11.5px;color:var(--ink3);margin-top:3px}
.shop .links{display:flex;gap:9px;margin-top:6px;font-size:12px}
.shop .links a{text-decoration:none;font-weight:700}
.thumb{width:52px;height:52px;border-radius:10px;object-fit:cover;background:#F0EBE5;border:1px solid var(--line)}
.store-h{background:var(--brand-l);padding:7px 14px;font-size:12.5px;font-weight:900;color:var(--ink2);
  position:sticky;top:52px;z-index:5}
#sh-box{border-radius:var(--r)}
#sh-box .store-h:first-child{border-radius:var(--r) var(--r) 0 0}
#sh-box .shop:last-child{border-radius:0 0 var(--r) var(--r)}

/* ══════════════════════════ 航班 ══════════════════════════ */
.fly{padding:16px;margin-bottom:12px}
.fly .top{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.fly .rt{display:grid;grid-template-columns:1fr auto 1fr;gap:8px;align-items:center;text-align:center}
.fly .ap{font-size:19px;font-weight:900}
.fly .tm{font-size:13px;font-weight:700;font-variant-numeric:tabular-nums}
.fly .dt{font-size:11px;color:var(--ink3)}
.fly .arrow{color:var(--brand);font-size:12px;position:relative;padding:0 4px}
.fly .arrow::before{content:"";position:absolute;left:-6px;right:-6px;top:50%;height:1.5px;
  background:repeating-linear-gradient(90deg,var(--line) 0 4px,transparent 4px 8px)}
.fly .arrow span{position:relative;background:#fff;padding:0 4px}

/* ══════════════════════════ 行前清單 ══════════════════════════ */
.prog{height:8px;background:var(--line);border-radius:99px;overflow:hidden;margin:8px 0 2px}
.prog i{display:block;height:100%;background:var(--ok);border-radius:99px;transition:.3s}
.cl-cat{margin-bottom:12px;overflow:hidden}
.cl-cat > summary{padding:13px 15px;font-size:14.5px;font-weight:900;cursor:pointer;
  list-style:none;display:flex;justify-content:space-between;align-items:center}
.cl-cat > summary::-webkit-details-marker{display:none}
.cl-cat > summary small{font-weight:600;color:var(--ink3);font-size:12px}
.cl-item{display:grid;grid-template-columns:auto 1fr;gap:11px;padding:11px 15px;
  border-top:1px solid var(--line);align-items:start}
.cl-item.done .txt{text-decoration:line-through;color:var(--ink3)}
.cl-item .txt{font-size:14px;font-weight:600;line-height:1.5}
.cl-item .who{font-size:11.5px;color:var(--ink3);margin-top:2px}

/* 通行碼鎖定畫面 */
#lock{position:fixed;inset:0;z-index:300;display:none;align-items:center;justify-content:center;
  padding:24px;background:linear-gradient(160deg,var(--brand) 0%,var(--brand-d) 100%)}
#lock.on{display:flex}
#lock .box{background:#fff;border-radius:20px;padding:30px 24px 24px;width:100%;max-width:340px;
  text-align:center;box-shadow:0 24px 60px rgba(0,0,0,.25)}
#lock .ico{font-size:38px;line-height:1}
#lock h2{margin:10px 0 2px;font-size:19px;font-weight:900}
#lock p{margin:0 0 18px;font-size:13px;color:var(--ink3)}
#lock input{width:100%;border:1.5px solid var(--line);border-radius:11px;padding:13px 14px;
  font-size:17px;font-family:inherit;text-align:center;letter-spacing:2px;margin-bottom:10px}
#lock input:focus{outline:0;border-color:var(--brand)}
#lock .btn{width:100%}
#lock .msg{margin-top:12px;font-size:13px;font-weight:700;color:var(--brand-d);min-height:19px}

/* 圖片放大 */
#lb{position:fixed;inset:0;background:rgba(20,18,17,.92);z-index:200;display:none;
  align-items:center;justify-content:center;padding:20px;cursor:zoom-out}
#lb.on{display:flex}
#lb img{max-width:100%;max-height:86vh;border-radius:12px;box-shadow:0 20px 60px rgba(0,0,0,.5)}
#lb .cap{position:absolute;left:0;right:0;bottom:22px;text-align:center;color:#fff;
  font-size:14px;font-weight:700;text-shadow:0 1px 6px rgba(0,0,0,.6);padding:0 24px}
#lb .x{position:absolute;top:14px;right:16px;color:#fff;font-size:30px;line-height:1;
  opacity:.75;background:none;border:0;cursor:pointer}
.thumb{cursor:zoom-in}

/* Toast */
#toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%) translateY(20px);
  background:var(--ink);color:#fff;padding:11px 20px;border-radius:99px;font-size:13.5px;
  font-weight:700;z-index:99;opacity:0;pointer-events:none;transition:.25s;max-width:90vw}
#toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
#toast.bad{background:#9B3320}

@media(max-width:420px){
  .hero h1{font-size:23px}
  .stat b{font-size:16px}
  .filters{grid-template-columns:1fr}
}
</style>
</head>
<body>

<!-- ════════════ Hero ════════════ -->
<header class="hero"><div class="wrap">
  <h1 id="h-title">載入中…</h1>
  <p class="sub" id="h-sub"></p>
  <div class="meta" id="h-meta"></div>
</div></header>

<!-- ════════════ Tabs ════════════ -->
<nav class="tabbar"><div class="inner wrap" id="tabbar">
  <button class="tab on" data-t="itinerary">🗓 行程</button>
  <button class="tab" data-t="expense">💰 分帳</button>
  <button class="tab" data-t="hotel">🏨 住宿</button>
  <button class="tab" data-t="shop">🛍 購物</button>
  <button class="tab" data-t="flight">✈️ 航班</button>
  <button class="tab" data-t="checklist">✅ 行前</button>
</div></nav>

<main class="wrap">
  <div id="boot"></div>

  <!-- 行程 -->
  <section id="p-itinerary">
    <div class="sec"><div class="days" id="days"></div></div>
    <div id="tl-box"><div class="loading"><div class="spin"></div>載入行程…</div></div>
  </section>

  <!-- 分帳 -->
  <section id="p-expense" class="hide">
    <div class="sec">
      <div class="sec-t">總覽 <small id="ex-rate"></small></div>
      <div class="stat-row" id="ex-stats"></div>
    </div>
    <div class="sec">
      <div class="sec-t">每個人的收支 <small id="ex-bal-note">正數 = 該收回</small></div>
      <div class="card" id="ex-bal"></div>
    </div>
    <div class="sec">
      <div class="sec-t">結算建議 <small>最少轉帳次數</small></div>
      <div class="settle" id="ex-settle"></div>
      <div id="ex-bulk" style="display:flex;gap:8px;margin-top:10px;flex-wrap:wrap"></div>
    </div>
    <div class="sec">
      <div class="sec-t">記一筆</div>
      <div class="card"><form class="f" id="ex-form">
        <div class="two">
          <div><label>日期</label><input type="date" id="f-date" required></div>
          <div><label>分類</label><select id="f-cat">
            <option>餐飲</option><option>交通</option><option>門票</option>
            <option>購物</option><option>住宿</option><option>機票</option><option>其他</option>
          </select></div>
        </div>
        <div><label>項目</label><input id="f-item" placeholder="例：矢場とん 晚餐" required></div>
        <div><label>付款人</label><div class="picks" id="f-payer"></div></div>
        <div class="two">
          <div><label>日幣 ¥</label><input type="number" id="f-jpy" inputmode="decimal" placeholder="0"></div>
          <div><label>台幣 NT$</label><input type="number" id="f-twd" inputmode="decimal" placeholder="0"></div>
        </div>
        <div><label>誰要分攤 <span class="muted">（點一下切換）</span></label>
          <div class="picks" id="f-split"></div></div>
        <div><label>備註</label><input id="f-note" placeholder="可留空"></div>
        <button class="btn" type="submit" id="f-sub">新增這筆花費</button>
      </form></div>
    </div>
    <div class="sec">
      <div class="sec-t">花費明細 <small id="ex-count"></small></div>
      <label class="muted" style="display:flex;gap:7px;align-items:center;margin:-4px 0 8px;cursor:pointer">
        <input type="checkbox" id="ex-showdone" style="width:16px;height:16px;accent-color:var(--brand)">
        顯示已結清的</label>
      <div class="card" id="ex-list"></div>
    </div>
  </section>

  <!-- 住宿 -->
  <section id="p-hotel" class="hide">
    <div class="sec"><div id="ho-box"><div class="loading"><div class="spin"></div>載入住宿…</div></div></div>
  </section>

  <!-- 購物 -->
  <section id="p-shop" class="hide">
    <div class="sec">
      <div class="filters">
        <select id="s-day"></select>
        <select id="s-who"></select>
        <select id="s-store" class="full"></select>
        <input id="s-q" class="full" placeholder="搜尋商品 / 店家…">
      </div>
      <div class="prog"><i id="s-prog"></i></div>
      <div class="muted" id="s-stat" style="text-align:right"></div>
    </div>
    <div class="card" id="sh-box">
      <div class="loading"><div class="spin"></div>載入購物清單…</div></div>
  </section>

  <!-- 航班 -->
  <section id="p-flight" class="hide">
    <div class="sec"><div id="fl-box"><div class="loading"><div class="spin"></div>載入航班…</div></div></div>
  </section>

  <!-- 行前清單 -->
  <section id="p-checklist" class="hide">
    <div class="sec">
      <div class="sec-t">準備進度 <small id="cl-stat"></small></div>
      <div class="prog"><i id="cl-prog"></i></div>
      <div class="filters" style="margin-top:12px"><select id="c-who" class="full"></select></div>
    </div>
    <div id="cl-box"><div class="loading"><div class="spin"></div>載入清單…</div></div>
  </section>
</main>

<div style="height:40px"></div>
<div id="lock"><div class="box">
  <div class="ico">🔒</div>
  <h2 id="lock-title">名古屋 5天4夜</h2>
  <p>請輸入通行碼</p>
  <input id="lock-in" type="password" autocomplete="current-password" placeholder="通行碼">
  <button class="btn" id="lock-go">進入</button>
  <div class="msg" id="lock-msg"></div>
</div></div>

<div id="lb"><button class="x" aria-label="關閉">&times;</button><img alt=""><div class="cap"></div></div>
<div id="toast"></div>

<!-- 你的設定放在同資料夾的 config.js，之後換新版 index.html 也不會被蓋掉 -->
<script src="config.js"></script>
<script>
/* ══════════════════════════════════════════════════════════════

/* ─────────────── 工具 ─────────────── */
function csvUrl(sheet){
  return `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq`
       + `?tqx=out:csv&headers=1&sheet=${encodeURIComponent(sheet)}&_=${Date.now()}`;
}
function parseCSV(t){
  const rows=[]; let row=[], cur='', q=false;
  for(let i=0;i<t.length;i++){
    const c=t[i];
    if(q){
      if(c==='"'){ if(t[i+1]==='"'){cur+='"';i++;} else q=false; }
      else cur+=c;
    }else{
      if(c==='"') q=true;
      else if(c===','){ row.push(cur); cur=''; }
      else if(c==='\n'){ row.push(cur); rows.push(row); row=[]; cur=''; }
      else if(c!=='\r') cur+=c;
    }
  }
  if(cur!==''||row.length){ row.push(cur); rows.push(row); }
  return rows;
}
async function fetchSheet(name){
  const res = await fetch(csvUrl(name));
  if(!res.ok) throw new Error(`讀不到「${name}」分頁 (HTTP ${res.status})`);
  const txt = await res.text();
  if(/^\s*</.test(txt)) throw new Error('SHARING');
  const rows = parseCSV(txt).filter(r=>r.some(c=>String(c).trim()!==''));
  if(!rows.length) return [];
  const hs = rows[0].map(h=>String(h).trim());
  return rows.slice(1).map(r=>{
    const o={}; hs.forEach((h,i)=>o[h]=(r[i]??'').trim()); return o;
  });
}
const bool = v => /^(true|yes|1|v|✓|是)$/i.test(String(v).trim());
const esc  = s => String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const num  = v => { const n = parseFloat(String(v??'').replace(/[^0-9.\-]/g,'')); return isNaN(n)?0:n; };
const nt   = n => 'NT$'+Math.round(n).toLocaleString('en-US');
function driveImg(u,w){
  const s = String(u||'').trim();
  const m = s.match(/\/d\/([-\w]{20,})|[?&]id=([-\w]{20,})/);
  return m ? `https://drive.google.com/thumbnail?id=${m[1]||m[2]}&sz=w${w||400}` : s;
}
function mapLink(q,url){

/* ─────────────── 通行碼 ───────────────
   通行碼本身「不在這個檔案裡」，只存在 Code.gs。
   使用者輸入後算成 SHA-256 存在瀏覽器，之後不用再輸。
   網址加 ?logout=1 可以清掉重輸。                        */
const AUTH_KEY='nagoya-trip-auth';
let AUTH = '';
try{
  if(location.search.indexOf('logout')>=0) localStorage.removeItem(AUTH_KEY);
  AUTH = localStorage.getItem(AUTH_KEY) || '';
}catch(e){}

async function sha256hex(txt){
  try{
    const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(txt));
    return [...new Uint8Array(buf)].map(b=>b.toString(16).padStart(2,'0')).join('');
  }catch(e){ return txt; }        // 極舊瀏覽器／非安全環境 → 退回原文，後端也接受
}
function showLock(msg){
  $('#lock').classList.add('on');
  $('#lock-msg').textContent = msg||'';
  setTimeout(()=>$('#lock-in').focus(),100);
}
async function tryUnlock(){
  const v = $('#lock-in').value.trim();
  if(!v) return;
  const btn=$('#lock-go'); btn.disabled=true; btn.textContent='驗證中…';
  $('#lock-msg').textContent='';
  try{
    AUTH = await sha256hex(v);
    await callGAS('ping',{});                       // 後端驗，通過才存
    try{ localStorage.setItem(AUTH_KEY, AUTH); }catch(e){}
    location.href = location.pathname;              // 重新載入，狀態最乾淨
  }catch(err){
    AUTH='';
    $('#lock-msg').textContent =
      err.message==='AUTH_LOCKED' ? '錯太多次了，請 10 分鐘後再試'
      : /AUTH/.test(err.message)  ? '通行碼不對'
      : err.message;
    btn.disabled=false; btn.textContent='進入';
    $('#lock-in').select();
  }
}
$('#lock-go').onclick = tryUnlock;

/* 把使用者可能貼錯的幾種寫法自動修正成完整網址 */
function normGas(u){
  u = String(u||'').trim().replace(/^["'\s]+|["'\s]+$/g,'');
  if(!u) return '';
  if(/^AKfyc[\w-]+$/.test(u)) return 'https://script.google.com/macros/s/'+u+'/exec';   // 只貼了部署 ID
  if(/^https:\/\/script\.google\.com\/macros\/s\/[\w-]+$/.test(u)) return u+'/exec';    // 少了 /exec
  return u.replace(/\/+$/,'');
}
const GAS = normGas(GAS_URL);

let jseq=0;
function callGAS(action,payload){
  return new Promise((resolve,reject)=>{
    if(!GAS) return reject(new Error('尚未設定 GAS_URL，目前是唯讀模式'));
    const cb='__gas'+(++jseq);
    const s=document.createElement('script');
    const t=setTimeout(()=>{cleanup();reject(new Error('連線逾時'));},20000);
    function cleanup(){clearTimeout(t);delete window[cb];s.remove();}
    window[cb]=r=>{cleanup(); r&&r.ok?resolve(r.data):reject(new Error((r&&r.error)||'未知錯誤'));};
    s.onerror=()=>{cleanup();reject(new Error('無法連線到 Apps Script'));};
    s.src=GAS+'?callback='+cb+'&token='+encodeURIComponent(TOKEN)
        +'&auth='+encodeURIComponent(AUTH||'')
        +'&action='+encodeURIComponent(action)
        +'&payload='+encodeURIComponent(JSON.stringify(payload));
    document.body.appendChild(s);
  });
}

const pingUrl = () => GAS+'?token='+encodeURIComponent(TOKEN)+'&action=ping';

async function bootData(){

  if(!GAS_OK_RE.test(GAS)){ GAS_ERR='FORMAT'; return 'csv'; }

  catch(e){ GAS_ERR=e.message; console.warn('Apps Script 失敗，改用 CSV：',e.message); return 'csv'; }
}

async function getSheet(name){
  const rows = ALL ? (ALL[name]||[]) : await fetchSheet(name);
  const need = NEED[name];
  if(need && rows.length && !(need in rows[0])) throw new Error('WRONGSHEET');
  return rows;
}

/* ─────────────── 配色：由「主題色」一格自動推導整套 ─────────────── */
function hex2hsl(x){
  let h=String(x).trim().replace('#','');
  if(h.length===3) h=h.split('').map(c=>c+c).join('');
  if(!/^[0-9a-f]{6}$/i.test(h)) return null;
  const r=parseInt(h.slice(0,2),16)/255,g=parseInt(h.slice(2,4),16)/255,b=parseInt(h.slice(4,6),16)/255;
  const mx=Math.max(r,g,b),mn=Math.min(r,g,b); let hh=0,ss=0; const ll=(mx+mn)/2;
  if(mx!==mn){ const d=mx-mn; ss=ll>.5?d/(2-mx-mn):d/(mx+mn);
    hh = mx===r?((g-b)/d+(g<b?6:0)) : mx===g?((b-r)/d+2) : ((r-g)/d+4); hh/=6; }
  return [hh*360, ss*100, ll*100];
}
function hsl2hex(h,s,l){
  s=Math.max(0,Math.min(100,s))/100; l=Math.max(0,Math.min(100,l))/100;
  const k=n=>(n+h/30)%12, a=s*Math.min(l,1-l);
  const f=n=>{ const v=l-a*Math.max(-1,Math.min(k(n)-3,Math.min(9-k(n),1)));
               return Math.round(255*v).toString(16).padStart(2,'0'); };
  return '#'+f(0)+f(8)+f(4);
}
function applyTheme(){
  const R=document.documentElement.style;
  const hsl=hex2hsl(CFG['主題色']||'#C8553D');
  if(hsl){
    const [h,s,l]=hsl;
    R.setProperty('--brand',   CFG['主題色'].trim());
    R.setProperty('--brand-d', hsl2hex(h, Math.min(100,s*1.06), Math.max(16,l*0.74)));  // Hero 漸層、連結
    R.setProperty('--brand-l', hsl2hex(h, Math.min(60,s*0.90), 91));                     // 淺底色塊
    R.setProperty('--bg',      hex2hsl(CFG['背景色']||'') ? CFG['背景色'].trim()
                                                          : hsl2hex(h, Math.min(45,s*0.80), 97));
    R.setProperty('--line',    hsl2hex(h, Math.min(35,s*0.45), 90));
    const mt=document.querySelector('meta[name=theme-color]'); if(mt) mt.content=CFG['主題色'].trim();
  }
  if(CFG['圓角']) R.setProperty('--r', String(parseInt(CFG['圓角'],10)||16)+'px');
}

/* ═══════════════════ 啟動 ═══════════════════ */
(async function init(){
  try{
    await bootData();
    const cfg = await getSheet('設定');
    cfg.forEach(r=>CFG[r['項目']]=r['值']);
    if(!Object.keys(CFG).length) throw new Error('「設定」分頁是空的');
  }catch(e){
    if(/^AUTH/.test(GAS_ERR||'') || /^AUTH/.test(e.message||'')){
      showLock(GAS_ERR==='AUTH_LOCKED' ? '錯太多次了，請 10 分鐘後再試' : '');
      return;
    }
    $('#boot').innerHTML = errBox(e);
    return;
  }
  // 讀得到資料但 Apps Script 連不上（走 CSV 備援）→ 還是要提醒，不然按打勾會一直失敗
  if(/^AUTH/.test(GAS_ERR||'')){ showLock(); return; }
  if(GAS_ERR) $('#boot').innerHTML = gasHelp();

  MEMBERS = (CFG['成員']||'').split(',').map(s=>s.trim()).filter(Boolean);
  DAYS    = parseInt(CFG['天數']||'5',10) || 5;
  const sd = (CFG['出發日']||'').replace(/[.\-]/g,'/');
  START   = /^\d{4}\/\d{1,2}\/\d{1,2}$/.test(sd) ? new Date(sd+' 00:00:00') : null;
  applyTheme();

  document.title = CFG['標題']||'旅遊行程';
  $('#h-title').textContent = CFG['標題']||'旅遊行程';
  $('#h-sub').textContent   = CFG['副標題']||'';
  const s=dayDate(1), e=dayDate(DAYS), meta=[];
  if(s&&e) meta.push(`${s.getFullYear()}/${fmtMD(s)} – ${fmtMD(e)}`);
  meta.push(`${DAYS} 天 ${DAYS-1} 夜`);
  if(MEMBERS.length) meta.push(`${MEMBERS.length} 人・${MEMBERS.join('、')}`);
  if(s){
    const dd=Math.ceil((s-new Date(new Date().toDateString()))/864e5);
    if(dd>0) meta.push(`還有 ${dd} 天`);
    else if(dd===0) meta.push('就是今天！');
  }
  $('#h-meta').innerHTML = meta.map(m=>`<span class="chip">${esc(m)}</span>`).join('');

  buildDays();
  loadItinerary();
  loadExpense(); loadHotel(); loadShop(); loadFlight(); loadChecklist();
})();

    return `<div class="day${i===0?' on':''}" data-d="${i+1}">
      <b>D${i+1}</b><span>${d?fmtMD(d)+' '+fmtWD(d):''}</span></div>`;

  }
  $('#tl-box').innerHTML = '<div class="tl">'+rows.map((r,i)=>{

    const dur = (r['抵達時間']&&r['離開時間']) ? diff(r['抵達時間'],r['離開時間']) : '';

      <div class="tl-time"><b>${esc(r['抵達時間']||'')}</b><span>${esc(dur)}</span></div>
      <div class="tl-body"><div class="tl-dot"></div><div class="tl-card">
        <div class="tl-tags">
          <span class="pill t-${esc(type)}">${esc(type)}</span>
          ${r['區域']?`<span class="pill" style="background:#F1EDE8;color:#6B635E">${esc(r['區域'])}</span>`:''}
        </div>

        ${r['說明']?`<p class="desc">${esc(r['說明'])}</p>`:''}
        ${foot.length?`<div class="tl-foot">${foot.join('')}</div>`:''}
      </div></div></div>`;
  }).join('')+'</div>';
}
function diff(a,b){
  const p=s=>{const m=String(s).match(/(\d{1,2}):(\d{2})/);return m?+m[1]*60+ +m[2]:null;};
  const x=p(a),y=p(b); if(x===null||y===null) return '';
  let d=y-x; if(d<0) d+=1440;
  return `(${Math.floor(d/60)}:${String(d%60).padStart(2,'0')})`;
}

function buildPicks(){
  $('#f-payer').innerHTML = MEMBERS.map(m=>`<button type="button" class="pick" data-m="${esc(m)}">${esc(m)}</button>`).join('');
  $('#f-split').innerHTML = MEMBERS.map(m=>`<button type="button" class="pick on" data-m="${esc(m)}">${esc(m)}</button>`).join('');
  payer = MEMBERS[0]||null; split = new Set(MEMBERS);
  $$('#f-payer .pick').forEach((b,i)=>b.classList.toggle('on',i===0));
  $('#f-payer').onclick = e=>{
    const b=e.target.closest('.pick'); if(!b) return;
    payer=b.dataset.m; $$('#f-payer .pick').forEach(x=>x.classList.toggle('on',x===b));
  };
  $('#f-split').onclick = e=>{
    const b=e.target.closest('.pick'); if(!b) return;
    const m=b.dataset.m;
    split.has(m)?split.delete(m):split.add(m);
    b.classList.toggle('on',split.has(m));
  };
}
function renderExp(){
  const rows=DB.exp||[];
  /* 已結算 = 這筆錢已經還清了，所以：
     ・總覽（總花費／平均每人）算全部 —— 這趟總共花了多少
     ・收支和結算建議只算「未結算」 —— 還沒喬完的部分       */
  const open = rows.filter(r=>!bool(r['已結算']));
  const doneCount = rows.length - open.length;
  const total=rows.reduce((s,r)=>s+twd(r),0);
  const per = MEMBERS.length? total/MEMBERS.length : 0;
  const openSum = open.reduce((s,r)=>s+twd(r),0);
  $('#ex-stats').innerHTML=`
    <div class="stat"><b>${nt(total)}</b><span>總花費（${rows.length} 筆）</span></div>
    <div class="stat"><b>${nt(per)}</b><span>平均每人</span></div>
    <div class="stat"><b>${nt(openSum)}</b><span>待結算（${open.length} 筆）</span></div>`;
  $('#ex-bal-note').textContent = doneCount
    ? `已排除 ${doneCount} 筆結清的` : '正數 = 該收回';

  const bal={}; MEMBERS.forEach(m=>bal[m]=0);
  open.forEach(r=>{
    const amt=twd(r); if(!amt) return;
    const sp=(r['分攤者']||'').split(/[,，、]/).map(s=>s.trim()).filter(Boolean);
    const list = sp.length?sp:MEMBERS;
    const p = (r['付款人']||'').trim();
    if(p in bal) bal[p]+=amt;
    list.forEach(m=>{ if(m in bal) bal[m]-=amt/list.length; });
  });
  $('#ex-bal').innerHTML = MEMBERS.map(m=>`
    <div class="bal"><span class="who">${esc(m)}</span>
      <span class="amt ${bal[m]>=0?'pos':'neg'}">${bal[m]>=0?'+':'−'}${nt(Math.abs(bal[m]))}</span></div>`).join('')
    || '<div class="bal muted">「設定」分頁還沒填成員</div>';

  // 最少轉帳次數
  const cred=[],debt=[];
  MEMBERS.forEach(m=>{ const v=Math.round(bal[m]);
    if(v>0)cred.push({m,v}); else if(v<0)debt.push({m,v:-v}); });
  cred.sort((a,b)=>b.v-a.v); debt.sort((a,b)=>b.v-a.v);
  const tx=[]; let i=0,j=0;
  while(i<debt.length&&j<cred.length){
    const v=Math.min(debt[i].v,cred[j].v);
    if(v>0) tx.push(`<div class="row">👤 <b>${esc(debt[i].m)}</b> → <b>${esc(cred[j].m)}</b> <b>${nt(v)}</b></div>`);
    debt[i].v-=v; cred[j].v-=v;
    if(debt[i].v<1)i++; if(cred[j].v<1)j++;
  }
  $('#ex-settle').innerHTML = tx.length ? tx.join('')
    : (rows.length && !open.length ? '🎉 全部都結清了，帳目歸零'
                                   : '🎉 目前大家都是平的，不用轉帳');

  // 一次結清 / 一次取消（都要按兩下確認）
  $('#ex-bulk').innerHTML =
    (open.length ? `<button class="btn sm" data-bulk="TRUE">全部標記結清（${open.length} 筆）</button>` : '') +
    (doneCount   ? `<button class="btn sm ghost" data-bulk="FALSE">全部取消結清（${doneCount} 筆）</button>` : '');

  // 花費列表（可切換要不要顯示已結清的）
  const showDone = $('#ex-showdone').checked;
  const list = showDone ? rows : open;
  $('#ex-count').textContent = doneCount
    ? `未結清 ${open.length} 筆・已結清 ${doneCount} 筆` : `共 ${rows.length} 筆`;
  $('#ex-list').innerHTML = list.length? [...list].reverse().map(r=>{
    const sp=(r['分攤者']||'').split(/[,，、]/).map(s=>s.trim()).filter(Boolean);
    const done=bool(r['已結算']);
    return `<div class="exp-item${done?' done':''}">
      <div>
        <h5>${esc(r['項目']||'(未命名)')}</h5>
        <div class="sub">${esc(r['日期']||'')} · ${esc(r['分類']||'')} · ${esc(r['付款人']||'?')} 先付
          · 分攤 ${sp.length||MEMBERS.length} 人${r['備註']?' · '+esc(r['備註']):''}</div>
      </div>
      <div class="money">${nt(twd(r))}
        ${r['日幣']&&num(r['日幣'])?`<small>${CFG['幣別符號']||'¥'}${num(r['日幣']).toLocaleString()}</small>`:''}
        <button class="btn sm ghost" style="margin-top:6px" data-settle="${esc(r['ID'])}" data-v="${done?'FALSE':'TRUE'}">
          ${done?'已結算':'標記結清'}</button>
      </div></div>`;
  }).join('') : `<div class="bal muted">${rows.length?'沒有未結清的花費 🎉':'還沒有任何花費紀錄'}</div>`;

  $('#ex-list').onclick = async e=>{
    const b=e.target.closest('[data-settle]'); if(!b) return;
    b.disabled=true;
    try{
      await callGAS('setCells',{sheet:'花費',id:b.dataset.settle,values:{'已結算':b.dataset.v}});
      const row=(DB.exp||[]).find(x=>x['ID']===b.dataset.settle); if(row) row['已結算']=b.dataset.v;
      renderExp(); toast('已更新');
    }catch(err){ toast(err.message,1); b.disabled=false; }
  };
}
$('#ex-showdone').onchange = ()=>renderExp();

/* 批次結清：第一下先變成確認鍵，6 秒沒動作自動復原，避免誤觸 */
$('#ex-bulk').onclick = async e=>{
  const b=e.target.closest('[data-bulk]'); if(!b) return;
  const to=b.dataset.bulk;
  if(b.dataset.armed!=='1'){
    b.dataset.armed='1'; b.dataset.label=b.textContent;
    b.textContent = to==='TRUE' ? '再按一次確認結清' : '再按一次確認取消';
    clearTimeout(b._t);
    b._t=setTimeout(()=>{ b.dataset.armed=''; b.textContent=b.dataset.label; },6000);
    return;
  }
  clearTimeout(b._t); b.disabled=true; b.textContent='處理中…';
  const targets=(DB.exp||[]).filter(r=>bool(r['已結算'])!==(to==='TRUE'));
  if(!targets.length){ renderExp(); return; }
  try{
    const res=await callGAS('setCellsMany',{sheet:'花費',
      items:targets.map(r=>({id:r['ID'],values:{'已結算':to}}))});
    targets.forEach(r=>r['已結算']=to);
    renderExp();
    toast(`已更新 ${res&&res.updated!=null?res.updated:targets.length} 筆`);
  }catch(err){ renderExp(); toast(err.message,1); }
};

$('#ex-form').onsubmit = async ev=>{
  ev.preventDefault();
  if(!payer) return toast('請選付款人',1);
  if(!split.size) return toast('至少要有一個人分攤',1);
  if(!num($('#f-jpy').value)&&!num($('#f-twd').value)) return toast('金額不能是 0',1);
  const btn=$('#f-sub'); btn.disabled=true; btn.textContent='送出中…';
  const vals={
    '日期': $('#f-date').value.replace(/-/g,'/'),
    '項目': $('#f-item').value.trim(),
    '分類': $('#f-cat').value,
    '付款人': payer,
    '日幣': $('#f-jpy').value||'',
    '台幣': $('#f-twd').value||'',
    '分攤者': [...split].join(','),
    '已結算':'FALSE',
    '備註': $('#f-note').value.trim()
  };
  try{
    const r=await callGAS('addRow',{sheet:'花費',values:vals});
    DB.exp.push(Object.assign({ID:r.id},vals));
    renderExp(); toast('已寫進 Google Sheet ✓');
    $('#f-item').value=''; $('#f-jpy').value=''; $('#f-twd').value=''; $('#f-note').value='';
  }catch(err){ toast(err.message,1); }
  btn.disabled=false; btn.textContent='新增這筆花費';
};

/* ═══════════════════ 4. 購物 ═══════════════════ */
async function loadShop(){
  try{
    DB.shop=await getSheet('購物');
    const opt=(el,label,vals)=>{
      $(el).innerHTML=`<option value="">${label}</option>`+
        [...new Set(vals.filter(Boolean))].map(v=>`<option>${esc(v)}</option>`).join('');
    };
    opt('#s-day','全部天數',DB.shop.map(r=>r['天']));
    opt('#s-store','全部店家',DB.shop.map(r=>r['店家']));
    opt('#s-who','全部人',MEMBERS);
    ['#s-day','#s-store','#s-who'].forEach(s=>$(s).onchange=renderShop);
    $('#s-q').oninput=renderShop;
    renderShop();
  }catch(e){ $('#sh-box').innerHTML=errBox(e); }
}
function renderShop(){
  const all=DB.shop||[];
  const d=$('#s-day').value, st=$('#s-store').value, w=$('#s-who').value,
        q=$('#s-q').value.trim().toLowerCase();
  const rows=all.filter(r=>
    (!d||r['天']===d) && (!st||r['店家']===st) &&
    (!w||(r['誰要的']||'').includes(w)) &&
    (!q||(`${r['商品']} ${r['店家']} ${r['備註']}`).toLowerCase().includes(q)));
  const done=all.filter(r=>bool(r['已購買'])).length;
  $('#s-prog').style.width = all.length?(done/all.length*100)+'%':'0';
  $('#s-stat').textContent = `已買 ${done} / ${all.length} 項${rows.length!==all.length?`（篩選出 ${rows.length}）`:''}`;

  if(!rows.length){ $('#sh-box').innerHTML='<div class="loading">沒有符合的項目</div>'; return; }
  const g={}; rows.forEach(r=>{ const k=`${r['天']||'未分天'} · ${r['店家']||'未分店'}`; (g[k]=g[k]||[]).push(r); });
  $('#sh-box').innerHTML = Object.entries(g).map(([k,list])=>{
    const hrs=list[0]['營業時間'];
    return `<div class="store-h">${esc(k)}${hrs?` <span style="font-weight:500;color:var(--ink3)">· ${esc(hrs)}</span>`:''}</div>`
      + list.map(r=>{
        const done=bool(r['已購買']);
        const ml=mapLink(r['店家']+' '+(r['地址']||''), r['地圖連結']);
        return `<div class="shop${done?' done':''}">
          <button class="cb${done?' on':''}" data-id="${esc(r['ID'])}" data-v="${done?'FALSE':'TRUE'}" aria-label="打勾"></button>
          <div>
            <div class="name">${esc(r['商品']||'')}</div>
            <div class="who">${r['誰要的']?'👤 '+esc(r['誰要的']):''}${r['價格']?' · 約 '+esc(r['價格']):''}${r['備註']?' · '+esc(r['備註']):''}</div>
            <div class="links">
              ${ml?`<a href="${esc(ml)}" target="_blank" rel="noopener">📍 地圖</a>`:''}
              ${r['折價券']&&/^https?:/.test(r['折價券'])?`<a href="${esc(r['折價券'])}" target="_blank" rel="noopener">🎟 折價券</a>`:''}
            </div>
          </div>
          ${r['圖片']?`<img class="thumb" src="${esc(driveImg(r['圖片'],400))}"
              data-full="${esc(driveImg(r['圖片'],1600))}" data-cap="${esc(r['商品']||'')}"
              loading="lazy" alt="" onerror="this.style.display='none'">`:'<span></span>'}
        </div>`;
      }).join('');
  }).join('');
}
/* 點縮圖放大（購物、住宿都可以） */
function openLB(img){
  const lb=$('#lb');
  lb.querySelector('img').src = img.dataset.full || img.src;
  lb.querySelector('.cap').textContent = img.dataset.cap || '';
  lb.classList.add('on');
}
$('#lb').onclick = ()=>$('#lb').classList.remove('on');
document.addEventListener('keydown',e=>{ if(e.key==='Escape') $('#lb').classList.remove('on'); });
$('#ho-box').addEventListener('click',e=>{
  const im=e.target.closest('.thumb'); if(im) openLB(im);
});

$('#sh-box').onclick = async e=>{
  const im=e.target.closest('.thumb'); if(im){ openLB(im); return; }
  const b=e.target.closest('.cb'); if(!b) return;
  const id=b.dataset.id, v=b.dataset.v;
  b.classList.toggle('on', v==='TRUE');           // 先給回饋
  try{
    await callGAS('setCells',{sheet:'購物',id,values:{'已購買':v}});
    const row=(DB.shop||[]).find(x=>x['ID']===id); if(row) row['已購買']=v;
    renderShop();
  }catch(err){ b.classList.toggle('on', v!=='TRUE'); toast(err.message,1); }
};

/* ═══════════════════ 6. 行前清單 ═══════════════════ */
async function loadChecklist(){
  $('#c-who').innerHTML='<option value="">全部人</option>'+
    MEMBERS.map(m=>`<option>${esc(m)}</option>`).join('');
  $('#c-who').onchange=renderCL;
  try{ DB.cl=await getSheet('行前清單'); renderCL(); }
  catch(e){ $('#cl-box').innerHTML=errBox(e); }
}
function renderCL(){
  const all=DB.cl||[], w=$('#c-who').value;
  const rows=all.filter(r=>!w||!r['負責人']||r['負責人']==='全部'||r['負責人'].includes(w));
  const done=rows.filter(r=>bool(r['已完成'])).length;
  $('#cl-prog').style.width = rows.length?(done/rows.length*100)+'%':'0';
  $('#cl-stat').textContent = `${done} / ${rows.length} 完成`;
  const g={}; rows.forEach(r=>{ const k=r['分類']||'其他'; (g[k]=g[k]||[]).push(r); });
  $('#cl-box').innerHTML = Object.entries(g).map(([k,list])=>{
    const d=list.filter(r=>bool(r['已完成'])).length;
    return `<details class="card cl-cat"${d<list.length?' open':''}>
      <summary>${esc(k)} <small>${d}/${list.length}</small></summary>
      ${list.map(r=>{
        const ok=bool(r['已完成']);
        return `<div class="cl-item${ok?' done':''}">
          <button class="cb${ok?' on':''}" data-id="${esc(r['ID'])}" data-v="${ok?'FALSE':'TRUE'}" aria-label="打勾"></button>
          <div><div class="txt">${esc(r['項目']||'')}</div>
            <div class="who">${r['負責人']?'👤 '+esc(r['負責人']):''}${r['備註']?' · '+esc(r['備註']):''}</div></div>
        </div>`;
      }).join('')}</details>`;
  }).join('') || '<div class="card" style="padding:30px;text-align:center">沒有項目</div>';
}
$('#cl-box').onclick = async e=>{
  const b=e.target.closest('.cb'); if(!b) return;
  e.preventDefault();
  const id=b.dataset.id, v=b.dataset.v;
  b.classList.toggle('on', v==='TRUE');
  try{
    await callGAS('setCells',{sheet:'行前清單',id,values:{'已完成':v}});
    const row=(DB.cl||[]).find(x=>x['ID']===id); if(row) row['已完成']=v;
    renderCL();
  }catch(err){ b.classList.toggle('on', v!=='TRUE'); toast(err.message,1); }
};
